server:
  port: 8080
spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/acgbox
    username: postgres
    password: 123456
    driver-class-name: org.postgresql.Driver
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      where-strategy: not_empty
