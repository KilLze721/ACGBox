# 示例文件可以提交，实际私有文件放在仓库之外，不要在本文件填写真实密钥或授权码。
# 本机私有文件路径：D:/ACGBox-config/application-secrets.yml，实际配置只修改该私有文件。
# 只修改冒号后面的值，保留配置项名称和缩进；字符串建议保留双引号。
# 修改后重启后端才会生效；示例中的占位文本不能直接用于启动。

# JWT 签名密钥：填写至少 32 字节随机密钥经过 Base64 编码后的文本，不是普通登录密码。
# 更换密钥会使现有 JWT 签名校验失败，也会影响已有邮箱验证码的摘要校验。
ACGBOX_JWT_SECRET: ""


# 邮箱验证码开关：false 为关闭，true 为开启，填写布尔值时不需要双引号。
# SMTP 发信信息和 Redis 均配置完成后才改为 true；关闭时仍可查询账号和修改密码。
ACGBOX_ACCOUNT_EMAIL_ENABLED: false
# SMTP 服务器地址：填写邮件服务商提供的 SMTP 域名，不是邮箱网页地址，也不带 https://。
ACGBOX_MAIL_HOST: ""
# SMTP 端口：以服务商要求为准；常见 587 对应 STARTTLS，465 对应隐式 TLS。
# 切换端口时同时检查下面的 ACGBOX_MAIL_STARTTLS 和 ACGBOX_MAIL_SSL。
ACGBOX_MAIL_PORT: 465
# SMTP 认证账号：一般为完整发信邮箱地址，具体格式以邮件服务商为准。
ACGBOX_MAIL_USERNAME: ""
# SMTP 认证密码：通常填写邮件服务商生成的授权码或应用专用密码。
ACGBOX_MAIL_PASSWORD: ""
# 发件地址：必须填写服务商允许使用的发信邮箱，通常与 ACGBOX_MAIL_USERNAME 相同。
ACGBOX_MAIL_FROM: ""
# STARTTLS 开关：常见 587 端口设为 true，当前程序同时要求 STARTTLS 升级成功。
# 使用常见 465 隐式 TLS 时设为 false，同时将下面的 SSL 开关设为 true。
ACGBOX_MAIL_STARTTLS: false
# 隐式 TLS 开关：常见 465 端口设为 true，常见 587 STARTTLS 方式设为 false。
ACGBOX_MAIL_SSL: true


# Redis 主机地址
ACGBOX_REDIS_HOST: "localhost"
# Redis 服务端口：默认 6379；使用容器或端口映射时填写后端实际能够访问的端口。
ACGBOX_REDIS_PORT: 6379
# Redis ACL 用户名：使用具名 ACL 用户时填写该用户名，普通默认用户配置可留空。
ACGBOX_REDIS_USERNAME: ""
# Redis 认证密码：填写 Redis 服务器配置的密码，不是数据库密码或网站登录密码。
# 只有 Redis 服务端确实未启用密码时才可留空；生产环境应配置认证并限制网络访问。
ACGBOX_REDIS_PASSWORD: ""
# Redis 逻辑数据库编号：通常保持 0，可用编号以服务端配置为准，不是数据库名称。
ACGBOX_REDIS_DATABASE: 0


# 连接地址格式：jdbc:postgresql://主机:端口/数据库名，PostgreSQL 常见端口为 5432。
# 示例连接本机 acgbox 数据库；远程部署时按实际主机、端口和数据库名填写。
ACGBOX_DB_URL: "jdbc:postgresql://localhost:5432/acgbox"
# PostgreSQL 登录用户名，不是管理端的 admin 账号；按数据库实际授权账号填写。
ACGBOX_DB_USERNAME: "postgres"
# PostgreSQL 用户的登录密码；填写实际密码并保留引号。
ACGBOX_DB_PASSWORD: ""


